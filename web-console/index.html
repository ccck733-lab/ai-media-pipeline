<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 自媒体生成控制台</title>
  <style>
:root {
  --bg: #0a0a0f;
  --surface: #131318;
  --surface-2: #1a1a22;
  --border: #2a2a35;
  --ink: #e8e8ec;
  --muted: #888894;
  --brand: #6c5ce7;
  --brand-light: #a29bfe;
  --accent: #00cec9;
  --green: #00b894;
  --amber: #fdcb6e;
  --red: #e74c3c;
  --radius: 14px;
  --shadow: 0 4px 24px rgba(0,0,0,.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== Header ===== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--brand), var(--accent));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.header h1 { font-size: 17px; font-weight: 700; }
.header .sub { font-size: 12px; color: var(--muted); }
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
}
.header-right { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }

/* ===== Layout ===== */
.container {
  max-width: 880px;
  margin: 0 auto;
  padding: 24px 16px 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ===== Hero / Topic Input ===== */
.hero {
  background: linear-gradient(160deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--shadow);
}
.hero-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
  background: linear-gradient(135deg, var(--brand-light), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-desc { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

.input-group { display: flex; flex-direction: column; gap: 12px; }
.input-row { display: flex; gap: 10px; align-items: stretch; }
.topic-input {
  flex: 1;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--ink);
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
}
.topic-input:focus { border-color: var(--brand); }
.topic-input::placeholder { color: #555560; }

.account-select {
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--ink);
  font-size: 14px;
  cursor: pointer;
  min-width: 160px;
}
.account-select option { background: var(--surface); }

.gen-btn {
  padding: 14px 28px;
  background: linear-gradient(135deg, var(--brand), #8b7cf6);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: transform .1s, opacity .2s;
}
.gen-btn:hover { opacity: .9; }
.gen-btn:active { transform: scale(.97); }
.gen-btn:disabled { opacity: .5; cursor: not-allowed; }

/* Quick topic chips */
.topic-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip {
  padding: 5px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
}
.chip:hover { border-color: var(--brand); color: var(--ink); }

/* ===== Progress ===== */
.progress-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  display: none;
}
.progress-card.active { display: block; }

.progress-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.progress-header h3 { font-size: 15px; font-weight: 600; }
.progress-status {
  font-size: 13px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
}
.progress-status.running { background: rgba(253,203,110,.15); color: var(--amber); }
.progress-status.done { background: rgba(0,184,148,.15); color: var(--green); }
.progress-status.failed { background: rgba(231,76,60,.15); color: var(--red); }
.progress-status.queued { background: rgba(108,92,231,.15); color: var(--brand-light); }

.steps-track {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
}
.step-bar {
  flex: 1;
  height: 6px;
  background: var(--surface-2);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.step-bar.fill {
  background: linear-gradient(90deg, var(--brand), var(--accent));
}
.step-bar.active::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(90deg, var(--brand), var(--accent));
  animation: pulse-fill 1.5s ease-in-out infinite;
}
@keyframes pulse-fill {
  0%, 100% { opacity: .4; }
  50% { opacity: 1; }
}

.step-labels {
  display: flex;
  gap: 4px;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 16px;
}
.step-label { flex: 1; text-align: center; }
.step-label.done { color: var(--green); }
.step-label.active { color: var(--accent); font-weight: 600; }

.log-box {
  background: #08080c;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  color: #7aa2a8;
  max-height: 200px;
  overflow: auto;
  white-space: pre-wrap;
  line-height: 1.5;
}
.log-box::-webkit-scrollbar { width: 6px; }
.log-box::-webkit-scrollbar-track { background: transparent; }
.log-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ===== Result / Video ===== */
.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  display: none;
}
.result-card.active { display: block; }
.result-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
.result-video { width: 100%; border-radius: 10px; border: 1px solid var(--border); }
.result-actions { display: flex; gap: 10px; margin-top: 12px; }
.dl-btn {
  padding: 8px 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--ink);
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
  transition: border-color .2s;
}
.dl-btn:hover { border-color: var(--brand); }

.artifacts-toggle {
  margin-top: 12px;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
}
.artifacts-toggle:hover { color: var(--ink); }
.artifacts-list {
  display: none;
  margin-top: 8px;
  flex-direction: column;
  gap: 4px;
}
.artifacts-list.open { display: flex; }
.artifact-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: var(--surface-2);
  border-radius: 6px;
  font-size: 12px;
}
.artifact-item .name { color: var(--ink); }
.artifact-item .size { color: var(--muted); }
.artifact-item a { color: var(--brand-light); text-decoration: none; }

/* ===== History ===== */
.history-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
}
.history-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
.history-list { display: flex; flex-direction: column; gap: 8px; }
.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: border-color .15s;
}
.history-item:hover { border-color: var(--border); }
.history-left { display: flex; align-items: center; gap: 10px; }
.history-topic { font-size: 14px; font-weight: 500; }
.history-meta { font-size: 12px; color: var(--muted); }
.history-status {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
}
.history-status.done { background: rgba(0,184,148,.15); color: var(--green); }
.history-status.running { background: rgba(253,203,110,.15); color: var(--amber); }
.history-status.failed { background: rgba(231,76,60,.15); color: var(--red); }
.history-status.queued { background: rgba(108,92,231,.15); color: var(--brand-light); }

.empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 20px; }

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .input-row { flex-direction: column; }
  .account-select { min-width: 0; }
  .step-labels { font-size: 9px; }
  .header .sub { display: none; }
}

/* Spinner */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo">AI</div>
      <div>
        <h1>AI 自媒体生成控制台</h1>
        <p class="sub">DeepSeek 写稿 · VoxCPM 配音 · Remotion 渲染</p>
      </div>
    </div>
    <div class="header-right">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">检测中</span>
    </div>
  </header>

  <div class="container">
    <!-- Hero: Topic Input -->
    <section class="hero">
      <h2 class="hero-title">输入选题，一键生成视频</h2>
      <p class="hero-desc">填入话题，AI 自动写脚本、合成语音、渲染动态画面，输出带配音的竖屏视频。</p>
      <div class="input-group">
        <div class="input-row">
          <input class="topic-input" id="topic" type="text" placeholder="例如：为什么年轻人开始存黄金" />
          <select class="account-select" id="account"></select>
        </div>
        <div class="input-row">
          <button class="gen-btn" id="gen-btn">生成视频</button>
        </div>
        <div class="topic-chips" id="chips"></div>
      </div>
    </section>

    <!-- Progress -->
    <section class="progress-card" id="progress-card">
      <div class="progress-header">
        <h3 id="progress-title">正在生成…</h3>
        <span class="progress-status" id="progress-status">queued</span>
      </div>
      <div class="steps-track" id="steps-track"></div>
      <div class="step-labels" id="step-labels"></div>
      <div class="log-box" id="log-box">等待日志…</div>
    </section>

    <!-- Result -->
    <section class="result-card" id="result-card">
      <h3>成片预览</h3>
      <video class="result-video" id="result-video" controls></video>
      <div class="result-actions" id="result-actions"></div>
      <div class="artifacts-toggle" id="artifacts-toggle">展开全部产物</div>
      <div class="artifacts-list" id="artifacts-list"></div>
    </section>

    <!-- History -->
    <section class="history-card">
      <h3>历史任务</h3>
      <div class="history-list" id="history-list">
        <div class="empty-state">暂无任务</div>
      </div>
    </section>
  </div>

  <script>
const STEP_NAMES = ["选题拆解", "写脚本", "字幕配音", "视频画面", "分发清单", "评论复盘"];
const SUGGESTED_TOPICS = [
  "为什么年轻人开始存黄金",
  "2026年最值得学的3个技能",
  "为什么越来越多人做副业",
  "存钱还是投资？年轻人怎么选",
];

let pollTimer = null;
let currentJobId = null;

// ===== API =====
const API = ""; // same origin

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ===== Init =====
async function init() {
  await checkHealth();
  await loadAccounts();
  await loadHistory();
  renderChips();
}

async function checkHealth() {
  const dot = document.getElementById("status-dot");
  const text = document.getElementById("status-text");
  try {
    const d = await api("/api/health");
    dot.style.background = "var(--green)";
    dot.style.boxShadow = "0 0 8px var(--green)";
    text.textContent = d.render_video ? "后端在线 · 渲染已启用" : "后端在线";
  } catch {
    dot.style.background = "var(--red)";
    dot.style.boxShadow = "0 0 8px var(--red)";
    text.textContent = "后端离线";
  }
}

async function loadAccounts() {
  try {
    const accounts = await api("/api/accounts");
    const sel = document.getElementById("account");
    sel.innerHTML = "";
    accounts.forEach(a => {
      const o = document.createElement("option");
      o.value = a.id;
      o.textContent = `${a.id} · ${a.platform}`;
      sel.appendChild(o);
    });
    if (!accounts.length) {
      sel.innerHTML = '<option value="douyin-default">douyin-default</option>';
    }
  } catch {
    document.getElementById("account").innerHTML = '<option value="douyin-default">douyin-default</option>';
  }
}

function renderChips() {
  const wrap = document.getElementById("chips");
  SUGGESTED_TOPICS.forEach(t => {
    const c = document.createElement("span");
    c.className = "chip";
    c.textContent = t;
    c.onclick = () => { document.getElementById("topic").value = t; };
    wrap.appendChild(c);
  });
}

// ===== Generate =====
async function startGenerate() {
  const topic = document.getElementById("topic").value.trim();
  const account = document.getElementById("account").value;
  if (!topic) { document.getElementById("topic").focus(); return; }

  const btn = document.getElementById("gen-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 生成中';

  // Show progress
  document.getElementById("progress-card").classList.add("active");
  document.getElementById("result-card").classList.remove("active");
  document.getElementById("progress-status").textContent = "queued";
  document.getElementById("progress-status").className = "progress-status queued";
  document.getElementById("progress-title").textContent = "任务已提交…";
  document.getElementById("log-box").textContent = "等待日志…";
  renderSteps(-1);

  try {
    const d = await api("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ account, steps: "all", topic })
    });
    currentJobId = d.job_id;
    pollJob(d.job_id);
  } catch (e) {
    document.getElementById("progress-status").textContent = "提交失败";
    document.getElementById("progress-status").className = "progress-status failed";
    document.getElementById("log-box").textContent = "错误：" + e.message;
    btn.disabled = false;
    btn.textContent = "生成视频";
  }
}

function renderSteps(activeStep) {
  const track = document.getElementById("steps-track");
  const labels = document.getElementById("step-labels");
  track.innerHTML = "";
  labels.innerHTML = "";
  STEP_NAMES.forEach((name, i) => {
    const bar = document.createElement("div");
    bar.className = "step-bar";
    if (i < activeStep) bar.classList.add("fill");
    else if (i === activeStep) bar.classList.add("active");
    track.appendChild(bar);

    const label = document.createElement("div");
    label.className = "step-label";
    if (i < activeStep) label.classList.add("done");
    else if (i === activeStep) label.classList.add("active");
    label.textContent = name;
    labels.appendChild(label);
  });
}

function parseStepFromLog(log) {
  if (!log) return -1;
  const lines = log.split("\n");
  const stepMap = {
    "topic_mining": 0, "script_writing": 1, "subtitle_dub": 2,
    "video_gen": 3, "distribution": 4, "review": 5,
  };
  let current = -1;
  for (const line of lines) {
    // orchestrator 输出格式: "--- 步骤: topic_mining ---"
    const m = line.match(/步骤:\s*(\w+)/);
    if (m && stepMap[m[1]] !== undefined) current = stepMap[m[1]];
    // Remotion 渲染阶段
    if (line.includes("Encoded") || line.includes("remotion")) current = 3;
  }
  return current;
}

function pollJob(jobId) {
  if (pollTimer) clearInterval(pollTimer);
  const doPoll = async () => {
    try {
      const j = await api(`/api/job/${jobId}`);
      const st = document.getElementById("progress-status");
      st.textContent = j.status === "queued" ? "排队中" : j.status === "running" ? "运行中" : j.status === "done" ? "完成" : "失败";
      st.className = `progress-status ${j.status}`;

      const log = j.log_tail || "";
      document.getElementById("log-box").textContent = log || "等待日志…";

      const step = parseStepFromLog(log);
      renderSteps(step);

      if (j.status === "done" || j.status === "failed") {
        clearInterval(pollTimer);
        pollTimer = null;
        const btn = document.getElementById("gen-btn");
        btn.disabled = false;
        btn.textContent = "生成视频";

        if (j.status === "done" && j.videos && j.videos.length) {
          showResult(j);
        } else if (j.status === "done") {
          document.getElementById("progress-title").textContent = "流程完成，无视频产物";
        } else {
          document.getElementById("progress-title").textContent = "生成失败";
        }
        loadHistory();
      } else {
        document.getElementById("progress-title").textContent = `正在生成: ${STEP_NAMES[step] || "处理中"}…`;
      }
    } catch (e) {
      document.getElementById("log-box").textContent = "轮询失败: " + e.message;
    }
  };
  doPoll();
  pollTimer = setInterval(doPoll, 2000);
}

function showResult(job) {
  const card = document.getElementById("result-card");
  card.classList.add("active");
  const video = document.getElementById("result-video");
  const v = job.videos[0];
  video.src = `${API}/api/file?path=${encodeURIComponent(v.path)}`;
  video.play().catch(() => {});

  // Actions
  const actions = document.getElementById("result-actions");
  actions.innerHTML = "";
  const dl = document.createElement("a");
  dl.className = "dl-btn";
  dl.href = `${API}/api/file?path=${encodeURIComponent(v.path)}`;
  dl.download = v.name;
  dl.textContent = "下载 MP4";
  actions.appendChild(dl);

  // Artifacts
  const list = document.getElementById("artifacts-list");
  list.innerHTML = "";
  (job.artifacts || []).forEach(a => {
    if (a.is_video) return;
    const item = document.createElement("div");
    item.className = "artifact-item";
    const sz = a.size > 1024 ? (a.size / 1024).toFixed(1) + "KB" : a.size + "B";
    item.innerHTML = `<span class="name">${a.name}</span><span class="size">${sz} · <a href="${API}/api/file?path=${encodeURIComponent(a.path)}" download>下载</a></span>`;
    list.appendChild(item);
  });
  document.getElementById("artifacts-toggle").onclick = () => {
    list.classList.toggle("open");
  };
}

// ===== History =====
async function loadHistory() {
  try {
    const jobs = await api("/api/jobs");
    const list = document.getElementById("history-list");
    if (!jobs.length) {
      list.innerHTML = '<div class="empty-state">暂无任务</div>';
      return;
    }
    list.innerHTML = "";
    jobs.forEach(j => {
      const item = document.createElement("div");
      item.className = "history-item";
      const stText = j.status === "done" ? "完成" : j.status === "running" ? "运行中" : j.status === "queued" ? "排队" : "失败";
      const ts = j.finished_at ? new Date(j.finished_at * 1000).toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"}) : "";
      item.innerHTML = `
        <div class="history-left">
          <span class="history-status ${j.status}">${stText}</span>
          <div>
            <div class="history-topic">${j.topic || j.account}</div>
            <div class="history-meta">${j.account} ${ts ? "· " + ts : ""}</div>
          </div>
        </div>
        <span class="history-meta">${j.job_id}</span>
      `;
      item.onclick = () => {
        if (j.status === "done") {
          currentJobId = j.job_id;
          pollJob(j.job_id);
        }
      };
      list.appendChild(item);
    });
  } catch {}
}

// ===== Events =====
document.getElementById("gen-btn").addEventListener("click", startGenerate);
document.getElementById("topic").addEventListener("keydown", (e) => {
  if (e.key === "Enter") startGenerate();
});

init();
</script>
</body>
</html>
